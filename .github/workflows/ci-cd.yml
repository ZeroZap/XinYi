# XinYi Embedded Framework - CI/CD Workflow
# GitHub Actions configuration for automated testing and code quality

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  # ===========================================================================
  # Build and Test Job
  # ===========================================================================
  build-test:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Debug, Release]
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: clang

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup build environment (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          gcovr \
          lcov

    - name: Setup build environment (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja gcovr

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DBUILD_TESTING=ON \
          -DTEST_COVERAGE=ON \
          -G Ninja

    - name: Build project
      run: |
        cmake --build build --config ${{ matrix.build-type }}

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose

    - name: Generate coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.build-type == 'Debug'
      run: |
        cd build
        gcovr -r .. \
          --html --html-details \
          -o coverage-report.html \
          --exclude '.*tests/.*' \
          --exclude '.*third_party/.*'

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.build-type == 'Debug'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.build-type }}
        path: build/coverage-report.html

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}-${{ matrix.build-type }}
        path: build/
        retention-days: 7

  # ===========================================================================
  # Code Quality Job
  # ===========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format

    - name: Check code formatting
      run: |
        # Find all C/C++ files and check formatting
        find . -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
          grep -v "third_party" | \
          grep -v "build" | \
          xargs clang-format --dry-run --Werror

    - name: Install clang-tidy
      run: |
        sudo apt-get install -y clang-tidy

    - name: Run static analysis
      run: |
        # Configure with clang-tidy enabled
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DCMAKE_C_CLANG_TIDY=clang-tidy

        # Build to trigger clang-tidy
        cmake --build build -- -k 0 || true

  # ===========================================================================
  # Documentation Job
  # ===========================================================================
  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate API documentation
      run: |
        cd docs/doxygen
        doxygen Doxyfile.osal || true

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: api-documentation
        path: docs/doxygen/html/
        retention-days: 7

  # ===========================================================================
  # Summary Job
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-test, code-quality, documentation]
    if: always()

    steps:
    - name: Check job statuses
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build & Test: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "### Documentation: ${{ needs.documentation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.build-test.result }}" == "success" ] && \
           [ "${{ needs.code-quality.result }}" == "success" ] && \
           [ "${{ needs.documentation.result }}" == "success" ]; then
          echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "❌ Some checks failed!" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
