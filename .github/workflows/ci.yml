name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [PC, STM32]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM GCC (for STM32)
        if: matrix.platform == 'STM32'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Build examples
        run: |
          cd examples/component_demo
          mkdir -p build && cd build
          cmake .. -DPLATFORM=${{ matrix.platform }}
          make

      - name: Run tests (PC only)
        if: matrix.platform == 'PC'
        run: |
          cd examples/component_demo/build
          ./component_demo

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gcov
        run: sudo apt-get install -y gcovr

      - name: Build with coverage
        run: |
          cd examples/component_demo
          mkdir -p build && cd build
          cmake .. -DPLATFORM=PC -DCMAKE_C_FLAGS="--coverage"
          make

      - name: Run tests
        run: |
          cd examples/component_demo/build
          ./component_demo

      - name: Generate coverage report
        run: |
          cd examples/component_demo/build
          gcovr -r ../../.. --html-details coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: examples/component_demo/build/coverage.html

  release:
    needs: [build, test-coverage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_v1.0.0.md
          draft: false
          prerelease: false
