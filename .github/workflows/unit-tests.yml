name: Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unity CTest unit gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release facts
        run: |
          python3 tools/scripts/check_release_facts.py
          python3 tools/scripts/check_capability_claims.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcovr clang-format libsdl2-dev

      - name: Configure unit tests
        run: cmake -S tests/unit -B build/tests/unit

      - name: Build unit tests
        run: cmake --build build/tests/unit -j$(nproc)

      - name: Run unit tests
        run: >-
          ctest --test-dir build/tests/unit --output-on-failure
          -E '^(canonical_host_clean_checkout|pc_artifact_reproducibility)$'

      - name: Verify canonical Host committed clean export
        run: >-
          ctest --test-dir build/tests/unit --output-on-failure
          -R '^canonical_host_clean_checkout$'

      - name: Verify reproducible PC static-library artifact
        run: >-
          ctest --test-dir build/tests/unit --output-on-failure
          -R '^pc_artifact_reproducibility$'

      - name: Configure PC root build
        run: cmake -S . -B build/pc -DHAL_PLATFORM=PC -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Build PC root target
        run: cmake --build build/pc -j$(nproc)

      - name: Configure SDL2-enabled PC root build
        run: >-
          cmake -S . -B build/pc-sdl
          -DHAL_PLATFORM=PC
          -DCMAKE_BUILD_TYPE=Release
          -DKCONFIG_OVERRIDES=BUILD_TESTING=OFF\;GUI_SDL=ON

      - name: Build real SDL2 GUI backend
        run: cmake --build build/pc-sdl --target xy_gui -j$(nproc)

      - name: Run real SDL2 headless runtime contract
        run: ctest --test-dir build/tests/unit --output-on-failure -R '^gui_sdl_runtime$'

      - name: Check whitespace in changed files
        run: git diff --check

      - name: Check formatting for touched C/C++ files
        run: tools/scripts/check_touched_format.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Guard against new raw assert() in tests/unit
        run: |
          if grep -RIn --include='*.c' --include='*.h' -E '(^|[^A-Za-z0-9_])assert[[:space:]]*\(' tests/unit; then
            echo "Raw assert() is not allowed in tests/unit; use Unity assertions instead." >&2
            exit 1
          fi

      - name: Generate optional coverage report
        run: |
          cmake -S tests/unit -B build/tests/unit_coverage -DXY_ENABLE_UNIT_COVERAGE=ON
          cmake --build build/tests/unit_coverage --target unit_coverage -j$(nproc)

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: build/tests/unit_coverage/coverage/
          if-no-files-found: ignore

      - name: Upload unit test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            build/tests/unit/Testing/Temporary/LastTest.log
            build/tests/unit_coverage/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
