# XinYi 嵌入式框架文档

site_name: XinYi Docs
site_description: 模块化、生产级的嵌入式 C 框架
site_url: https://xinyi.zerovoid.com/
site_author: XinYi Team

# 仓库配置
repo_name: ZeroZap/XinYi
repo_url: https://github.com/ZeroZap/XinYi
edit_uri: blob/main/docs/

# 主题配置
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.ico
  logo: assets/logo.svg

# 导航菜单
nav:
  - 首页: index.md
  - 快速开始:
    - 文档中心: README.md
    - 项目简介: getting-started/introduction.md
    - 5 分钟上手: getting-started/QUICK_START.md
    - 开发者指南: getting-started/DEVELOPER_GUIDE.md
    - 开发环境与工具链: getting-started/toolchain.md
    - 构建指南: BUILD_GUIDE.md
  - 组件文档:
    - 组件总览: components/index.md
    - OSAL: components/osal/introduction.md
    - HAL: components/hal/introduction.md
    - Crypto: components/crypto/introduction.md
    - CLib: components/clib/introduction.md
    - DM: components/dm/introduction.md
    - NET: components/net/introduction.md
    - Sensor: components/sensor/introduction.md
    - Device: components/device/introduction.md
    - IPC: components/ipc/introduction.md
    - PM: components/pm/introduction.md
    - PID: components/pid/introduction.md
    - ADDC: components/addc/introduction.md
    - FOTA: components/fota/introduction.md
    - GUI: components/gui/introduction.md
    - Trace: components/trace/introduction.md
    - 驱动模板: components/device/DRIVER_TEMPLATE.md
  - API 参考:
    - 索引: api/index.md
    - 函数签名: api/API_REFERENCE.md
    - 汇总参考: API_REFERENCE.md
    - HAL 统一 API: hal/HAL_UNIFIED_API.md
  - 硬件支持:
    - 概述: hardware/index.md
    - 支持的开发板: hardware/boards.md
    - 移植指南: hardware/porting.md
    - RTOS 选择: hardware/rtos_selection_guide.md
  - 验证与计划:
    - 组件证据矩阵: validation/component-evidence-matrix.md
    - HAL 平台证据矩阵: validation/hal-platform-evidence-matrix.md
    - Sprint 跟踪: plans/SPRINT_TRACKER.md
  - 规范与设计:
    - RULEBOOK: rules/RULEBOOK.md
    - 代码风格: rules/code_style.md
    - C 编码标准: rules/C_Coding_Standard_Full.md
    - 仓库阅读指南: rules/repo_guide.md
    - 项目概览: design/XinYi_Project_Overview.md
    - 单元测试清单: design/unit-test-inventory.md
  - 示例代码:
    - 概述: samples/index.md
  - 贡献指南:
    - 概述: contribute/index.md
    - 代码风格: contribute/code-style.md
    - 提交 PR: contribute/submit-pr.md
  - 关于:
    - 项目简介: about/index.md
    - 更新日志: about/changelog.md
    - 常见问题: about/faq.md

# 插件配置
plugins:
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: date
      locale: zh

# Markdown 扩展
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: ZeroZap
      repo: XinYi
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# 额外配置
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ZeroZap/XinYi
    - icon: fontawesome/brands/discord
      link: https://discord.gg/xxx
  generator: false

# 额外 CSS/JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
